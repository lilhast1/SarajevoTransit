spring.datasource.url=jdbc:h2:mem:userservice_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true

spring.sql.init.mode=never

eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.config.enabled=false

jwt.private-key=classpath:keys/rsa-private-key.pem
jwt.public-key=classpath:keys/rsa-public-key.pem
jwt.access-token.expiration=900
jwt.refresh-token.expiration=604800
