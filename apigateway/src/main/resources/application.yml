server:
  port: 8080
  tomcat:
    max-http-post-size: 20MB

jwt:
  public-key: classpath:keys/rsa-public-key.pem

spring:
  application:
    name: apigateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  profiles:
    default: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
    gateway:
      mvc:
        routes:
          - id: auth-route
            uri: lb://userservice
            predicates:
              - Path=/api/auth/**

          - id: userservice-route
            uri: lb://userservice
            predicates:
              - Path=/api/v1/users/**, /api/users/**

          - id: userservice-admin-loyalty-tiers-route
            uri: lb://userservice
            predicates:
              - Path=/api/v1/admin/loyalty/tiers/**, /api/admin/loyalty/tiers/**

          - id: feedbackservice-route
            uri: lb://feedbackservice
            predicates:
              - Path=/api/v1/workflows/**, /api/v1/reviews/**, /api/v1/reports/**

          - id: notificationservice-route
            uri: lb://notifications
            predicates:
              - Path=/notifications/**, /subscriptions/**

          - id: vehicleservice-route
            uri: lb://vehicle-service
            predicates:
              - Path=/api/vehicles/**

          - id: routingservice-lines-route
            uri: lb://routingservice
            predicates:
              - Path=/api/v1/lines/**

          - id: routingservice-routes-route
            uri: lb://routingservice
            predicates:
              - Path=/api/v1/routes/**

          - id: routingservice-realtime-route
            uri: lb://routingservice
            predicates:
              - Path=/api/v1/realtime/**

          - id: routingservice-admin-realtime-route
            uri: lb://routingservice
            predicates:
              - Path=/api/v1/admin/realtime/**

          - id: routingservice-admin-otp-rebuild-route
            uri: lb://routingservice
            predicates:
              - Path=/api/v1/admin/otp-rebuild/**, /api/v1/admin/otp-rebuild-state

          - id: moneyman-route
            uri: lb://moneyman
            predicates:
              - Path=/api/finance/**, /api/payments/**

          - id: userservice-discovery-benchmark
            uri: lb://userservice
            predicates:
              - Path=/api/v1/discovery/benchmark/**, /api/discovery/benchmark/**

          - id: feedbackservice-discovery
            uri: lb://feedbackservice
            predicates:
              - Path=/api/v1/discovery/**, /api/discovery/**


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: "gateway,health,info,metrics"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: userservice
        url: /v3/api-docs/userservice
      - name: feedbackservice
        url: /v3/api-docs/feedbackservice
      - name: notificationservice
        url: /v3/api-docs/notificationservice
      - name: vehicleservice
        url: /v3/api-docs/vehicleservice
      - name: routingservice
        url: /v3/api-docs/routingservice
      - name: moneyman
        url: /v3/api-docs/moneyman
