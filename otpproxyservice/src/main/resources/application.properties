spring.application.name=otp-proxy
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

otp.base-url=${OTP_BASE_URL:http://localhost:${OTP_HOST_PORT:18080}}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Blue-Green OTP endpoints
otp.blue.url=${OTP_BLUE_URL:http://otp-blue:8080}
otp.green.url=${OTP_GREEN_URL:http://otp-green:8080}
otp.active-color=${OTP_ACTIVE_COLOR:BLUE}
otp.swap-drain-seconds=${OTP_SWAP_DRAIN_SECONDS:30}
otp.data-dir=${OTP_DATA_DIR:./otp-data}

# Routingservice callback URL
routing.base-url=${ROUTING_BASE_URL:http://routingservice:9999}
routing.admin-token=${ROUTING_GTFS_ADMIN_TOKEN:}

# Actuator
management.endpoints.web.exposure.include=health,info

# Docker Engine API (used for OTP blue-green rebuilds)
docker.socket-path=${DOCKER_SOCKET_PATH:/var/run/docker.sock}
docker.network=${DOCKER_NETWORK:sarajevo-transit-net}
docker.otp-image=${DOCKER_OTP_IMAGE:opentripplanner/opentripplanner:latest}
